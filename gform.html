<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample form</title>
</head>
<body>
    <form>
    <h1>Student registration form</h1>
    <label>Full Name:</label>
    <input type="text" placeholder="Enter your name"><br><br>
    <label>Email:</label>
    <input type="email" placeholder="Enter your email"><br><br>
    <label>Password:</label>
    <input type="password" placeholder="Enter your password"><br><br>
    <label>Age:</label>
    <input type="number" placeholder="Enter your age"><br><br>
    <label>Date of Birth:</label>
    <input type="date" placeholder="Enter DOB"><br><br>
    <label>Gender</label>
    <input type="radio" placeholder="Gender">
    <label>Female</label>
    <input type="radio" placeholder="Gender">
    <label>Male</label>
    <input type="radio" placeholder="Gender">
    <label>Others</label><br><br>
    <label>Department</label>
    <select>
        <option>SELECT</option>
        <option>AIDS</option>
        <option>CSE</option>
        <option>EEE</option>
        <option>ECE</option>
    </select><br><br>
    <label>Skills</label>
    <input type="checkbox">
    <label>Java</label>
    <input type="checkbox">
    <label>Python</label>
    <input type="checkbox">
    <label>C program</label><br><br>
    <label>Address:</label>
    <textarea></textarea><br><br>
    <button>Submit</button>
    <input type="reset">
    <hr>
    </form>

    <table border="1">
        <tr>
            <th>mon</th>
            <th>tue</th>
            <th>wed</th>
            <th>thrus</th>
            <th>fri</th>
        </tr>
        <tr>
            <td>mat</td>
            <td>sci</td>
            <td>soc</td>
            <td>tam</td>
            <td>eng</td>
        </tr>
    </table>

</body>
</html>
