<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><b>Willingness to be a part in Hackathon</b></h1>
    <label>Name:</label>
    <input type="text" placeholder="Enter name"><br><br>
    <label>Roll no: (eg: 2026UCSxxxx)</label>
    <input type="text" placeholder="Enter RollNo"><br><br>
    <label>Dpt</label>
    <select>
        <option>SELECT</option>
        <option>CSE</option>
        <option>AIDS</option>
        <option>EEE</option>
        <option>ECE</option>
        <option>AGRI</option>
    </select><br><br>
    <label>Year</label>
    <select>
        <option>SELECT</option>
        <option>I</option>
        <option>II</option>
        <option>III</option>
        <option>IV</option>
    </select><br><br>
    <label>Willing to participate in Hackathon</label><br>
    <input type="radio" placeholder="1">
    <label>Yes</label>
    <input type="radio" placeholder="2">
    <label>No</label><br><br>
    <button>Submit</button>

</body>
</html>
