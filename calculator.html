<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <center>
        <div style="background-color: black; width: 220px; height: 230px; padding: 20px; border-radius: 20px;">
        <h3><input type="text" size="25" style="border-radius: 5px; width: 200px; height: 20px; text-align: center; font-style: italic; font-weight: bold;" placeholder="Welcome to Calculator"></h3>
        <h5 style="color: white; text-align: right; font-size: small; width: 200px; height: 1px;">0</h5>
        <!--<input type="text" style="text-align: right; background-color: black; color: white;" placeholder="0">-->
        <table>
            <tr>
                <th><button style="width: 50px; height: 30px; border-radius: 50px; background-color: gray;">AC</button></th>
                <th><button style="width: 50px; height: 30px; border-radius: 50px; background-color: gray">🡄</button></th>
                <th><button style="width: 50px; height: 30px; border-radius: 50px; background-color: gray">%</button></th>
                <th><button style="width: 50px; height: 30px; border-radius: 50px; font-size: x-large; background-color: orange; color: white;">÷</button></th>
            </tr>
            <tr>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">7</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">8</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">9</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: orange; color: white">X</button></td>
            </tr>
            <tr>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">4</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">5</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">6</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; font-size: larger; background-color: orange; color: white">-</button></td>
            </tr>
            <tr>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">1</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">2</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">3</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; font-size: x-large; background-color: orange; color: white">+</button></td>
            </tr>
            <tr>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">0</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: rgb(56, 50, 50); color: white;">00</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; font-size: x-large; background-color: rgb(56, 50, 50); color: white;">.</button></td>
                <td><button style="width: 50px; height: 30px; border-radius: 50px; background-color: orange; color: white"><b>=</b></button></td>
            </tr>
        </table>
    </div>
    </center>

</body>
</html>
