<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googleform SRF</title>
</head>
<body>
    <form>
        <h1><b>Student Registration Form</b></h1><br><br>
        <table>
            <tr>     
                <td>Roll no. :</td><td><input type="text" size="48"></td>
            </tr>
            <tr>
                <td>Student name:</td><td><input type="text" placeholder="First Name"><label> - </label> <input type="text" placeholder="Last Name"></td>
            </tr>
            <tr>
                <td>Father's name :</td><td><input type="text" size="48"></td>
            </tr>
            <tr>
                <td>Date of birth :</td><td><input type="date"></td>
            </tr>
            <tr>
                <td>Mobile no. :</td><td><input type="text" size="1" placeholder="+91"><label> - </label><input type="text"></td>
            </tr>
            <tr>
                <td>Email id :</td><td><input type="email" size="48"></td>
            </tr>
            <tr>
                <td>Password :</td><td><input type="password"size="48"></td>
            </tr>
            <tr>
                <td>Gender :</td><td><input type="radio" name="Gender">Male<input type="radio" name="Gender">Female</td>
            </tr>
            <tr>
                <td>Department:</td><td><input type="checkbox" name="1">CSE<input type="checkbox" name="2">IT<input type="checkbox" name="3">ECE<input type="checkbox" name="4">Civil<input type="checkbox" name="5">Mech</td>
            </tr>
            <tr>
                <td>Course :</td><td><select><option>----------Select Current Course's----------</option><option>B.tech</option><option>B.E</option></select></td>
            </tr>        
            <tr>
                <td>Student photo :</td><td><button>Choose File</button> No file chosen</td>
            </tr>
            <tr>
                <td>City :</td><td><input type="text" size="48"></td>
            </tr>
            <tr>
                <td>Address : &nbsp;</td><td><textarea></textarea></td>
</body>
</html>
